<style>

:root{
    --bg:#0b132b;
    --secondary:#1c2541;
    --card:#202c4f;
    --gold:#f7b801;
    --blue:#48cae4;
    --text:#edf2f4;
    --muted:#9aa6bd;
    --danger:#ef233c;
    --success:#52b788;
    --border:rgba(255,255,255,.12);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* HEADER */

header{
    height:68px;
    background:var(--secondary);
    border-bottom:1px solid var(--border);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 20px;
}

.brand{
    font-size:22px;
    font-weight:800;
}

.brand span{
    color:var(--gold);
}

.header-buttons{
    display:flex;
    gap:8px;
}

.btn{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);

    padding:9px 13px;
    border-radius:8px;
}

.btn:hover{
    border-color:var(--gold);
}

.btn-primary{
    background:var(--gold);
    color:#111;
    border:none;
    font-weight:bold;
}

/* AUTH */

.auth{
    width:92%;
    max-width:430px;

    margin:60px auto;

    background:var(--secondary);
    border:1px solid var(--border);
    border-radius:14px;

    padding:28px;
}

.auth h1{
    text-align:center;
    color:var(--gold);
    margin-bottom:8px;
}

.auth p{
    text-align:center;
    color:var(--muted);
    margin-bottom:20px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:var(--muted);
    margin-bottom:6px;
}

.field input{
    width:100%;
    padding:12px;

    background:var(--card);
    color:var(--text);

    border:1px solid var(--border);
    border-radius:8px;

    outline:none;
}

.field input:focus{
    border-color:var(--blue);
}

.auth-main-button{
    width:100%;
    padding:12px;

    background:var(--gold);
    color:#111;

    border:0;
    border-radius:8px;

    font-weight:bold;
}

.message{
    min-height:22px;
    margin:8px 0;

    color:var(--danger);
    text-align:center;
}

.toggle{
    margin-top:18px;
    text-align:center;
}

.toggle a{
    color:var(--blue);
    cursor:pointer;
}

/* APPLICATION */

.app-layout{
    display:grid;
    grid-template-columns:300px 1fr;

    min-height:calc(100vh - 68px);
}

.sidebar{
    background:var(--secondary);
    border-right:1px solid var(--border);

    overflow-y:auto;
    padding:15px;
}

.sidebar h2{
    color:var(--gold);
    margin-bottom:12px;
}

.chapter{
    padding:12px;

    border-bottom:1px solid var(--border);

    cursor:pointer;
}

.chapter:hover{
    background:var(--card);
}

.lesson-list{
    display:none;
    margin-top:8px;
}

.chapter.open .lesson-list{
    display:block;
}

.lesson{
    padding:9px 8px 9px 20px;

    color:var(--muted);

    border-radius:6px;
}

.lesson:hover{
    background:var(--card);
    color:var(--blue);
}

/* MAIN */

.main{
    padding:25px;
    overflow:auto;
}

.card{
    background:var(--secondary);

    border:1px solid var(--border);
    border-radius:14px;

    padding:25px;
}

.card h1{
    color:var(--gold);
    margin-bottom:10px;
}

.tag{
    color:var(--muted);
    margin-bottom:20px;
}

.formula{
    background:var(--card);

    border-left:4px solid var(--blue);

    padding:20px;

    margin:20px 0;

    text-align:center;

    overflow:auto;
}

/* MOBILE */

@media(max-width:760px){

    .app-layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        max-height:42vh;
    }

    .main{
        padding:15px;
    }
}

</style>

"Dans un conducteur en équilibre électrostatique, le champ électrique interne est nul et la totalité du volume conducteur se trouve au même potentiel. Toutes les charges en excès se répartissent exclusivement sur la surface extérieure du conducteur."
],
"2-3":[
"Le courant électrique représente le déplacement ordonné de porteurs de charges électriques au sein d'un milieu conducteur. L'intensité I du courant est le débit de charge à travers une section donnée par unité de temps, I = dQ/dt.",
"Par convention historique, le sens du courant électrique est défini comme le sens de déplacement des charges positives, soit du potentiel le plus élevé vers le potentiel le plus bas, ce qui est opposé au déplacement réel des électrons dans un métal.",
"La densité de courant vectorielle J caractérise le flux local de charges. Elle est liée à la vitesse de dérive v_d des porteurs et à leur concentration n par la relation J = n·q·v_d, reliant ainsi l'échelle microscopique au courant macroscopique."
],
"2-4":[
"La résistance électrique R caractérise l'opposition d'un composant au passage du courant électrique. Pour un conducteur ohmique filiforme de longueur L, de section S et de résistivité ρ, la résistance s'exprime par R = ρ·L/S.",
"La loi d'Ohm établit une relation linéaire directe entre la tension U aux bornes d'un dipôle ohmique et l'intensité I du courant qui le traverse, matérialisée par la formule classique U = R·I.",
"La résistivité d'un matériau dépend de sa structure interne et augmente généralement avec la température dans les métaux en raison de la diffusion accrue des électrons par les vibrations du réseau cristallin."
],
"2-5":[
"Les lois de Kirchhoff décrivent la distribution des courants et des tensions dans un réseau électrique. La loi des nœuds découle de la conservation de la charge : la somme algébrique des courants entrant dans un nœud est égale à la somme des courants qui en sortent.",
"La loi des mailles dérive de la circulation conservative du champ électrostatique : la somme algébrique des différences de potentiel le long de n'importe quelle maille fermée d'un circuit est rigoureusement nulle.",
"Ces deux lois permettent de poser un système d'équations algébriques linéaires dont la résolution donne l'ensemble des intensités et des potentiels inconnus dans les réseaux complexes à dipôles passifs et actifs."
],
"2-6":[
"Un condensateur est constitué de deux armatures conductrices séparées par un milieu isolant appelé diélectrique. Lorsqu'une tension U est appliquée entre les armatures, le composant accumule une charge Q = C·U sur son armature positive et -Q sur son armature négative.",
"La capacité C dépend uniquement de la géométrie des armatures et des propriétés du diélectrique. Pour un condensateur plan de surface S et d'épaisseur d, elle vaut C = ε·S/d, où ε est la permutivité diélectrique du milieu.",
"Lors de sa charge, un condensateur emmagasine de l'énergie sous forme de champ électrique dans son diélectrique. Cette énergie potentielle électrostatique accumulée s'exprime par la relation E = ½·C·U²."
],
"2-7":[
"La puissance électrique P consommée ou fournie par un dipôle sous une tension U et traversé par un courant I est donnée par le produit P = U·I. Dans un récepteur, cette puissance correspond au débit d'énergie reçue.",
"L'effet Joule traduit la dissipation irréversible d'énergie électrique sous forme de chaleur lors du passage d'un courant dans un conducteur ohmique. La puissance dissipée s'écrit P = R·I² ou P = U²/R.",
"L'énergie électrique totale E transférée pendant un intervalle de temps t s'obtient par l'intégration E = ∫ P dt. Dans le cas d'un régime permanent à puissance constante, cette énergie s'exprime simplement par E = P·t."
],

// --- CHAPITRE 3 : MAGNÉTISME ---
"3-0":[
"Un champ magnétique B est un champ vectoriel engendré par des charges électriques en mouvement ou par des moments magnétiques intrinsèques liés au spin des particules. Il exerce une force sur toute autre charge en mouvement le traversant.",
"Contrairement au champ électrique, il n'existe pas de monopôles magnétiques isolés dans la nature : les lignes de champ magnétique forment toujours des boucles fermées, ce qui se traduit par la relation ∇·B = 0.",
"La loi de Biot et Savart permet de calculer le champ magnétique créé en un point de l'espace par un élément de circuit parcouru par un courant dI, montrant que l'intensité du champ décroît avec le carré de la distance."
],
"3-1":[
"Une charge électrique q se déplaçant à une vitesse v dans un champ magnétique B subit une force magnétique perpendiculaire à son vecteur vitesse et au champ magnétique. Son module est donné par F = |q|·v·B·sin(θ).",
"Puisque la force magnétique est en tout point orthogonale à la trajectoire de la charge, son travail mécanique est rigoureusement nul. La force magnétique ne modifie donc pas l'énergie cinétique ni la norme de la vitesse de la particule.",
"Sous l'action d'un champ magnétique uniforme, une particule chargée injectée perpendiculairement aux lignes de champ décrit une trajectoire circulaire avec un rayon de courbure r = m·v / (|q|·B), appelé rayon de Larmor."
],
"3-2":[
"La force de Lorentz représente la force électromagnétique totale s'exerçant sur une particule de charge q soumise simultanément à un champ électrique E et un champ magnétique B. Elle s'exprime par le vecteur F = q·(E + v × B).",
"Cette force régit le comportement de la matière chargée dans tous les dispositifs électromagnétiques. La composante électrique agit directement le long des lignes de champ, tandis que la composante magnétique induit une déviation latérale.",
"Les filtres de vitesse et les spectromètres de masse utilisent l'équilibre des composantes de la force de Lorentz pour sélectionner des particules ayant des vitesses ou des rapports charge/masse précis."
],
"3-3":[
"La force de Laplace est la résultante macroscopique des forces de Lorentz individuelles subies par les porteurs de charge se déplaçant dans un conducteur métallique baigné par un champ magnétique extérieur.",
"Pour un élément de conducteur rectiligne de longueur vectorielle L parcouru par un courant d'intensité I et placé dans un champ B uniforme, la force de Laplace s'exprime par le produit vectoriel F = I · (L × B).",
"Ce principe de conversion directe de l'énergie électrique en énergie mécanique via l'interaction de Laplace constitue le principe de fonctionnement fondamental de tous les moteurs électriques."
],
"3-4":[
"Le théorème d'Ampère établit que la circulation du champ magnétique le long d'un contour fermé orienté est proportionnelle à la somme algébrique des courants électriques traversant la surface appuyée sur ce contour, soit ∮ B · dl = μ₀·I_enfermé.",
"Cette loi permet de déterminer l'expression du champ magnétique engendré par des distributions de courant présentant des symétries géométriques élevées, comme les fils rectilignes infinis ou les solénoïdes.",
"Pour un fil conducteur rectiligne indéfini parcouru par un courant I, l'application du théorème d'Ampère montre que le champ magnétique créé est orthoradial et s'atténue en 1/r selon la formule B = (μ₀·I) / (2π·r)."
],
"3-5":[
"L'induction électromagnétique désigne la production d'un champ électrique et d'une force électromotrice dans un circuit soumis à une variation de flux magnétique au cours du temps.",

"L'inductance propre L d'un composant exprime sa capacité à s'opposer aux variations brusques de courant. Un composant inductif emmagasine de l'énergie dans son champ magnétique interne, d'une valeur E = ½·L·I²."
],
"3-6":[

/* =====================================================
   UTILITAIRES
===================================================== */

function show(id){
    document.getElementById(id).classList.remove("hidden");
}

function hide(id){
    document.getElementById(id).classList.add("hidden");
}

function escapeHTML(value){
    return String(value || "")
        .replace(/[&<>"']/g, function(char){
            const map = {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            };
            return map[char];
        });
}


/* =====================================================
   PROGRAMME
===================================================== */

function renderCurriculum(){
    const container = document.getElementById("curriculum");
    container.innerHTML = "";

    PROGRAM.forEach(function(chapter, index){
        const chapterBox = document.createElement("div");
        chapterBox.className = "chapter";

        const title = document.createElement("div");
        title.innerHTML = "<b>" + chapter[0] + " " + chapter[1] + "</b>";

        const lessons = document.createElement("div");
        lessons.className = "lesson-list";

        chapter[2].forEach(function(lesson, indexLesson){
            const item = document.createElement("div");
            item.className = "lesson";
            item.textContent = lesson[0];

            item.onclick = function(e){
                e.stopPropagation();
                openLesson(index, indexLesson);
            };

            lessons.appendChild(item);
        });

        title.onclick = function(){
            chapterBox.classList.toggle("open");
        };

        chapterBox.appendChild(title);
        chapterBox.appendChild(lessons);
        container.appendChild(chapterBox);
    });
}


/* =====================================================
   LEÇON
===================================================== */

function openLesson(chapterIndex, lessonIndex){
    const chapter = PROGRAM[chapterIndex];
    const lesson = chapter[2][lessonIndex];

    document.getElementById("lessonTitle").textContent = lesson[0];
    document.getElementById("lessonTag").textContent = chapter[0] + " " + chapter[1] + " — Leçon " + (lessonIndex + 1);

    let htmlContent = `
        <p style="color:var(--muted)">Formule clé</p>
        <div class="formula">$$${lesson[1]}$$</div>
        <h3 style="margin:20px 0 10px">Cours</h3>
        <div id="textBloc"></div>
    `;

    document.getElementById("lessonContent").innerHTML = htmlContent;

    const key = chapterIndex + "-" + lessonIndex;
    const textContainer = document.getElementById("textBloc");

    if(COURS_TEXTE[key]){
        textContainer.innerHTML = COURS_TEXTE[key].map(function(p){
            return '<p style="line-height:1.8;margin-bottom:14px">' + escapeHTML(p) + '</p>';
        }).join("");
    } else {
        textContainer.innerHTML = '<p style="line-height:1.8">Le contenu de cette leçon est en cours de finalisation.</p>';
    }

    if(window.renderMathInElement){
        renderMathInElement(document.getElementById("lessonContent"), {
            delimiters: [
                { left: "$$", right: "$$", display: true }
            ],
            throwOnError: false
        });
    }
}

renderCurriculum();
