<!DOCTYPE html>

<style>

:root{
    --bg:#0b132b;
    --secondary:#1c2541;
    --card:#202c4f;
    --gold:#f7b801;
    --blue:#48cae4;
    --text:#edf2f4;
    --muted:#9aa6bd;
    --danger:#ef233c;
    --success:#52b788;
    --border:rgba(255,255,255,.12);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* HEADER */

header{
    height:68px;
    background:var(--secondary);
    border-bottom:1px solid var(--border);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 20px;
}

.brand{
    font-size:22px;
    font-weight:800;
}

.brand span{
    color:var(--gold);
}

.header-buttons{
    display:flex;
    gap:8px;
}

.btn{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);

    padding:9px 13px;
    border-radius:8px;
}

.btn:hover{
    border-color:var(--gold);
}

.btn-primary{
    background:var(--gold);
    color:#111;
    border:none;
    font-weight:bold;
}

/* AUTH */

.auth{
    width:92%;
    max-width:430px;

    margin:60px auto;

    background:var(--secondary);
    border:1px solid var(--border);
    border-radius:14px;

    padding:28px;
}

.auth h1{
    text-align:center;
    color:var(--gold);
    margin-bottom:8px;
}

.auth p{
    text-align:center;
    color:var(--muted);
    margin-bottom:20px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:var(--muted);
    margin-bottom:6px;
}

.field input{
    width:100%;
    padding:12px;

    background:var(--card);
    color:var(--text);

    border:1px solid var(--border);
    border-radius:8px;

    outline:none;
}

.field input:focus{
    border-color:var(--blue);
}

.auth-main-button{
    width:100%;
    padding:12px;

    background:var(--gold);
    color:#111;

    border:0;
    border-radius:8px;

    font-weight:bold;
}

.message{
    min-height:22px;
    margin:8px 0;

    color:var(--danger);
    text-align:center;
}

.toggle{
    margin-top:18px;
    text-align:center;
}

.toggle a{
    color:var(--blue);
    cursor:pointer;
}

/* APPLICATION */

.app-layout{
    display:grid;
    grid-template-columns:300px 1fr;

    min-height:calc(100vh - 68px);
}

.sidebar{
    background:var(--secondary);
    border-right:1px solid var(--border);

    overflow-y:auto;
    padding:15px;
}

.sidebar h2{
    color:var(--gold);
    margin-bottom:12px;
}

.chapter{
    padding:12px;

    border-bottom:1px solid var(--border);

    cursor:pointer;
}

.chapter:hover{
    background:var(--card);
}

.lesson-list{
    display:none;
    margin-top:8px;
}

.chapter.open .lesson-list{
    display:block;
}

.lesson{
    padding:9px 8px 9px 20px;

    color:var(--muted);

    border-radius:6px;
}

.lesson:hover{
    background:var(--card);
    color:var(--blue);
}

/* MAIN */

.main{
    padding:25px;
    overflow:auto;
}

.card{
    background:var(--secondary);

    border:1px solid var(--border);
    border-radius:14px;

    padding:25px;
}

.card h1{
    color:var(--gold);
    margin-bottom:10px;
}

.tag{
    color:var(--muted);
    margin-bottom:20px;
}

.formula{
    background:var(--card);

    border-left:4px solid var(--blue);

    padding:20px;

    margin:20px 0;

    text-align:center;

    overflow:auto;
}

/* ADMIN */

.admin{
    padding:25px;
}

.admin-card{
    background:var(--secondary);

    border:1px solid var(--border);
    border-radius:14px;

    padding:25px;
}

.admin-card h1{
    color:var(--gold);
    margin-bottom:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;

    margin:20px 0;
}

.stat{
    background:var(--card);

    padding:20px;

    border-radius:10px;
}

.stat-title{
    color:var(--muted);
}

.stat-number{
    display:block;

    font-size:30px;
    font-weight:bold;

    color:var(--gold);

    margin-top:5px;
}

.table-container{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;

    background:var(--card);
}

th,
td{
    padding:12px;

    border-bottom:1px solid var(--border);

    text-align:left;
}

th{
    color:var(--gold);
}

.online{
    color:var(--success);
    font-weight:bold;
}

.offline{
    color:var(--muted);
}

/* MOBILE */

@media(max-width:760px){

    .app-layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        max-height:42vh;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .main{
        padding:15px;
    }

    .admin{
        padding:15px;
    }
}

</style>
</head>

/* =====================================================
   TEXTES DES COURS (ajout)
   Clé : numéro du chapitre - numéro de la leçon (à partir de 0)
===================================================== */

const COURS_TEXTE = {

"0-0":[
"La cinématique décrit le mouvement d'un corps sans chercher ce qui le provoque. On repère la position par un vecteur r qui dépend du temps, puis on en déduit la vitesse, qui mesure la rapidité du changement de position, et l'accélération, qui mesure celle du changement de vitesse.",
"Dans le mouvement rectiligne uniformément accéléré, l'accélération est constante et la vitesse varie linéairement : v = v₀ + at, avec une position x = x₀ + v₀t + ½at². Un objet en chute libre près de la Terre en est un exemple, avec a ≈ 9,8 m/s² vers le bas.",
"Le mouvement à deux dimensions se traite en séparant les axes : chaque composante évolue indépendamment de l'autre. Pour un projectile sans frottement, la composante horizontale reste uniforme tandis que la composante verticale subit la pesanteur. Cette décomposition est la méthode centrale des exercices de cinématique."
],

"0-1":[
"La dynamique relie le mouvement aux forces. La première loi de Newton affirme qu'un corps sur lequel la force totale est nulle conserve sa vitesse : il reste au repos ou poursuit un mouvement rectiligne uniforme, dans un référentiel galiléen.",
"La deuxième loi, ΣF = ma, est la relation de base : l'accélération est proportionnelle à la force résultante et inversement proportionnelle à la masse. Pour l'appliquer, on isole le système, on représente toutes les forces qui s'exercent sur lui, puis on projette l'équation sur des axes bien choisis.",
"La troisième loi précise que si un corps A exerce une force sur un corps B, alors B exerce sur A une force de même intensité et de sens opposé. Ces deux forces agissent sur des corps différents : elles ne s'annulent donc jamais dans l'équation d'un seul système."
],

"0-2":[
"Le travail d'une force mesure l'énergie qu'elle transfère à un corps lors d'un déplacement. Pour une force constante, il vaut W = F·d·cos θ, où θ est l'angle entre la force et le déplacement. Il est nul si la force est perpendiculaire au déplacement, comme la force normale d'un sol horizontal.",
"Le théorème de l'énergie cinétique affirme que le travail total des forces est égal à la variation de l'énergie cinétique, ½mv². Lorsque seules des forces conservatives agissent, comme le poids ou la force d'un ressort, l'énergie mécanique, somme des énergies cinétique et potentielle, reste constante.",
"La puissance exprime la rapidité avec laquelle l'énergie est transférée : P = dW/dt, soit P = F·v pour une force agissant sur un corps en mouvement. Elle s'exprime en watts, un watt valant un joule par seconde. Un moteur de 1 kW fournit ainsi 1 000 joules chaque seconde."
],

"0-3":[
"La quantité de mouvement d'un corps est le produit de sa masse par sa vitesse : p = mv. C'est une grandeur vectorielle, qui a la direction et le sens de la vitesse. Plus un corps est massif ou rapide, plus il est difficile de l'arrêter.",
"La deuxième loi de Newton s'écrit aussi ΣF = dp/dt. L'impulsion, produit de la force par la durée de son action, est égale à la variation de la quantité de mouvement. C'est pourquoi allonger la durée d'un choc, avec un airbag par exemple, réduit la force subie.",
"Pour un système isolé, c'est-à-dire soumis à aucune force extérieure résultante, la quantité de mouvement totale se conserve. Dans une collision, cette conservation est toujours valable ; l'énergie cinétique, elle, ne se conserve que si le choc est élastique."
],

"0-4":[
"La loi de la gravitation universelle de Newton décrit l'attraction entre deux masses : F = G·m₁m₂/r², où r est la distance entre leurs centres et G la constante gravitationnelle, environ 6,67×10⁻¹¹ N·m²/kg². La force est toujours attractive et diminue avec le carré de la distance.",
"À la surface de la Terre, cette force s'identifie au poids. L'intensité de la pesanteur vaut g = GM/R², soit environ 9,8 m/s², où M et R sont la masse et le rayon de la Terre. Elle diminue lorsqu'on s'éloigne de la surface.",
"L'énergie potentielle gravitationnelle entre deux masses s'écrit Ep = −G·m₁m₂/r, avec une valeur nulle à l'infini ; elle est donc négative pour un système lié. Cette expression permet de calculer la vitesse de libération, vitesse minimale pour échapper à l'attraction d'un astre."
],

"0-5":[
"Un projectile lancé avec une vitesse initiale v₀ et un angle α suit, sans frottement, une trajectoire parabolique. La composante horizontale de la vitesse reste constante, v₀cos α, tandis que la composante verticale varie avec l'accélération g. À hauteur égale, la portée est maximale pour un angle de 45°.",
"Un satellite en orbite circulaire est en chute libre permanente : la gravitation joue le rôle de force centripète. En écrivant GMm/r² = mv²/r, on obtient la vitesse orbitale v = √(GM/r), qui diminue quand le rayon de l'orbite augmente.",
"La période d'une orbite circulaire vaut T = 2π√(r³/GM), ce qui correspond à la troisième loi de Kepler : T² est proportionnel à r³. Un satellite géostationnaire a une période de 24 heures et se trouve à environ 36 000 km d'altitude, au-dessus de l'équateur."
],

"0-6":[

"Pour un pendule simple de longueur L, la période est T = 2π√(L/g). Cette formule est valable pour de petits angles, typiquement inférieurs à une quinzaine de degrés. Elle ne dépend pas de la masse suspendue.",
"Au cours d'une oscillation, l'énergie passe sans cesse d'une forme à l'autre : elle est entièrement potentielle aux extrémités, où la vitesse s'annule, et entièrement cinétique au passage par la position d'équilibre. En l'absence de frottements, l'énergie mécanique totale reste constante."
]

const COURS_SOURCES =

    'Pour approfondir (en anglais) : ' +
    '<a style="color:var(--blue)" target="_blank" rel="noopener" href="https://openstax.org/subjects/physics">OpenStax Physics</a> · ' +

/* =====================================================
   UTILITAIRES
===================================================== */

function show(id){

    document
        .getElementById(id)
        .classList
        .remove("hidden");

}


function hide(id){

    document
        .getElementById(id)
        .classList
        .add("hidden");

}


function escapeHTML(value){

    return String(value || "")
        .replace(/[&<>"']/g, function(char){

            const map = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            };

            return map[char];

        });

}


/* =====================================================
   PROGRAMME
===================================================== */

function renderCurriculum(){

    const container =
        document.getElementById("curriculum");


    container.innerHTML = "";


    PROGRAM.forEach(function(chapter,index){

        const chapterBox =
            document.createElement("div");

        chapterBox.className =
            "chapter";


        const title =
            document.createElement("div");

        title.innerHTML =
            "<b>" +
            chapter[0] +
            " " +
            chapter[1] +
            "</b>";


        const lessons =
            document.createElement("div");

        lessons.className =
            "lesson-list";


        chapter[2].forEach(function(lesson,indexLesson){

            const item =
                document.createElement("div");

            item.className =
                "lesson";

            item.textContent =
                lesson[0];


            item.onclick =
                function(){

                    openLesson(
                        index,
                        indexLesson
                    );

                };


            lessons.appendChild(item);

        });


        title.onclick =
            function(){

                chapterBox
                    .classList
                    .toggle("open");

            };


        chapterBox.appendChild(title);

        chapterBox.appendChild(lessons);

        container.appendChild(chapterBox);

    });

}


/* =====================================================
   LEÇON
===================================================== */

function openLesson(chapterIndex,lessonIndex){

    const chapter =
        PROGRAM[chapterIndex];

    const lesson =
        chapter[2][lessonIndex];


    document
        .getElementById("lessonTitle")
        .textContent =
        lesson[0];


    document
        .getElementById("lessonTag")
        .textContent =
        chapter[0] +
        " " +
        chapter[1] +
        " — Leçon " +
        (lessonIndex+1);


    document
        .getElementById("lessonContent")
        .innerHTML =

        `
        <p style="color:var(--muted)">
            Formule clé
        </p>

        <div class="formula">
            $$${lesson[1]}$$
        </div>

        <h3 style="margin:20px 0 10px">
            Cours
        </h3>

        <p style="line-height:1.8">
            Le contenu détaillé de cette leçon
            peut être ajouté ici : explication,
            exemples, exercices et corrections.
        </p>
        `;


    const cleCours = chapterIndex + "-" + lessonIndex;

    if(COURS_TEXTE[cleCours]){

        const note =
            document
            .getElementById("lessonContent")
            .querySelector("h3 + p");

        const bloc =
            document.createElement("div");

        bloc.innerHTML =
            COURS_TEXTE[cleCours]
            .map(function(texte){

                return '<p style="line-height:1.8;margin-bottom:14px">' +
                       escapeHTML(texte) +
                       '</p>';

            })
            .join("") + COURS_SOURCES;

        note.replaceWith(bloc);

    }


    if(window.renderMathInElement){

        renderMathInElement(
            document.getElementById("lessonContent"),
            {
                delimiters:[
                    {
                        left:"$$",
                        right:"$$",
                        display:true
                    }
                ],

                throwOnError:false
            }
        );

    }

}


renderCurriculum();

</script>
