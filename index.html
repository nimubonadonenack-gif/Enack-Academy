
 <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enack-Academy | Physique Générale</title>

<!-- KATEX POUR LES FORMULES -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

<script defer
src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

<script defer
src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

<style>

:root{
    --bg:#0b132b;
    --secondary:#1c2541;
    --card:#202c4f;
    --gold:#f7b801;
    --blue:#48cae4;
    --text:#edf2f4;
    --muted:#9aa6bd;
    --danger:#ef233c;
    --success:#52b788;
    --border:rgba(255,255,255,.12);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* HEADER */

header{
    height:68px;
    background:var(--secondary);
    border-bottom:1px solid var(--border);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 20px;
}

.brand{
    font-size:22px;
    font-weight:800;
}

.brand span{
    color:var(--gold);
}

.header-buttons{
    display:flex;
    gap:8px;
}

.btn{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);

    padding:9px 13px;
    border-radius:8px;
}

.btn:hover{
    border-color:var(--gold);
}

.btn-primary{
    background:var(--gold);
    color:#111;
    border:none;
    font-weight:bold;
}

/* AUTH */

.auth{
    width:92%;
    max-width:430px;

    margin:60px auto;

    background:var(--secondary);
    border:1px solid var(--border);
    border-radius:14px;

    padding:28px;
}

.auth h1{
    text-align:center;
    color:var(--gold);
    margin-bottom:8px;
}

.auth p{
    text-align:center;
    color:var(--muted);
    margin-bottom:20px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:var(--muted);
    margin-bottom:6px;
}

.field input{
    width:100%;
    padding:12px;

    background:var(--card);
    color:var(--text);

    border:1px solid var(--border);
    border-radius:8px;

    outline:none;
}

.field input:focus{
    border-color:var(--blue);
}

.auth-main-button{
    width:100%;
    padding:12px;

    background:var(--gold);
    color:#111;

    border:0;
    border-radius:8px;

    font-weight:bold;
}

.message{
    min-height:22px;
    margin:8px 0;

    color:var(--danger);
    text-align:center;
}

.toggle{
    margin-top:18px;
    text-align:center;
}

.toggle a{
    color:var(--blue);
    cursor:pointer;
}

/* APPLICATION */

.app-layout{
    display:grid;
    grid-template-columns:300px 1fr;

    min-height:calc(100vh - 68px);
}

.sidebar{
    background:var(--secondary);
    border-right:1px solid var(--border);

    overflow-y:auto;
    padding:15px;
}

.sidebar h2{
    color:var(--gold);
    margin-bottom:12px;
}

.chapter{
    padding:12px;

    border-bottom:1px solid var(--border);

    cursor:pointer;
}

.chapter:hover{
    background:var(--card);
}

.lesson-list{
    display:none;
    margin-top:8px;
}

.chapter.open .lesson-list{
    display:block;
}

.lesson{
    padding:9px 8px 9px 20px;

    color:var(--muted);

    border-radius:6px;
}

.lesson:hover{
    background:var(--card);
    color:var(--blue);
}

/* MAIN */

.main{
    padding:25px;
    overflow:auto;
}

.card{
    background:var(--secondary);

    border:1px solid var(--border);
    border-radius:14px;

    padding:25px;
}

.card h1{
    color:var(--gold);
    margin-bottom:10px;
}

.tag{
    color:var(--muted);
    margin-bottom:20px;
}

.formula{
    background:var(--card);

    border-left:4px solid var(--blue);

    padding:20px;

    margin:20px 0;

    text-align:center;

    overflow:auto;
}

/* ADMIN */

.admin{
    padding:25px;
}

.admin-card{
    background:var(--secondary);

    border:1px solid var(--border);
    border-radius:14px;

    padding:25px;
}

.admin-card h1{
    color:var(--gold);
    margin-bottom:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;

    margin:20px 0;
}

.stat{
    background:var(--card);

    padding:20px;

    border-radius:10px;
}

.stat-title{
    color:var(--muted);
}

.stat-number{
    display:block;

    font-size:30px;
    font-weight:bold;

    color:var(--gold);

    margin-top:5px;
}

.table-container{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;

    background:var(--card);
}

th,
td{
    padding:12px;

    border-bottom:1px solid var(--border);

    text-align:left;
}

th{
    color:var(--gold);
}

.online{
    color:var(--success);
    font-weight:bold;
}

.offline{
    color:var(--muted);
}

/* MOBILE */

@media(max-width:760px){

    .app-layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        max-height:42vh;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .main{
        padding:15px;
    }

    .admin{
        padding:15px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="brand">
        ENACK-<span>ACADEMY</span>
    </div>
</header>


<!-- =====================================================
     APPLICATION
===================================================== -->

<section
    id="appSection">

<div class="app-layout">

    <aside class="sidebar">

        <h2>
            ⚛️ Programme
        </h2>

        <div id="curriculum">
        </div>

    </aside>


    <main class="main">

        <div class="card">

            <h1 id="lessonTitle">
                Bienvenue sur Enack-Academy
            </h1>

            <div
                id="lessonTag"
                class="tag">
            </div>

            <div id="lessonContent">

                <p>
                    Sélectionnez une leçon dans
                    le menu pour commencer.
                </p>

            </div>

        </div>

    </main>

</div>

</section>


<script>

/* =====================================================

===================================================== */

"U=V_A-V_B"],

"\\sum I=0,\\ \\sum U=0"],

["Énergie et puissance électriques",
"P=UI=RI^2"]
]
],


[
"🧲",
"Magnétisme",
[
["Champ magnétique",
"B=\\frac{\\mu_0 I}{2\\pi r}"],

["Force magnétique",
"F=qvB\\sin\\theta"],

["Force de Lorentz",
"\\vec F=q(\\vec E+\\vec v\\times\\vec B)"],

["Force de Laplace",

"\\oint\\vec B\\cdot d\\vec l=\\mu_0I"],

]
],


[

"Électromagnétisme",
[
["Relations électricité-magnétisme",
"\\nabla\\times\\vec E=-\\frac{\\partial\\vec B}{\\partial t}"],

["Induction",
"e=-L\\frac{di}{dt}"],

["Flux magnétique",
"\\Phi=BS\\cos\\theta"],

["Lois de Faraday et Lenz",
"e=-\\frac{d\\Phi}{dt}"],

["Ondes électromagnétiques",

/* =====================================================
   UTILITAIRES
===================================================== */

function show(id){

    document
        .getElementById(id)
        .classList
        .remove("hidden");

}


function hide(id){

    document
        .getElementById(id)
        .classList
        .add("hidden");

}


function escapeHTML(value){

    return String(value || "")
        .replace(/[&<>"']/g, function(char){

            const map = {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            };

            return map[char];

        });

}


/* =====================================================
   PROGRAMME
===================================================== */

function renderCurriculum(){

    const container =
        document.getElementById("curriculum");


    container.innerHTML = "";


    PROGRAM.forEach(function(chapter,index){

        const chapterBox =
            document.createElement("div");

        chapterBox.className =
            "chapter";


        const title =
            document.createElement("div");

        title.innerHTML =
            "<b>" +
            chapter[0] +
            " " +
            chapter[1] +
            "</b>";


        const lessons =
            document.createElement("div");

        lessons.className =
            "lesson-list";


        chapter[2].forEach(function(lesson,indexLesson){

            const item =
                document.createElement("div");

            item.className =
                "lesson";

            item.textContent =
                lesson[0];


            item.onclick =
                function(){

                    openLesson(
                        index,
                        indexLesson
                    );

                };


            lessons.appendChild(item);

        });


        title.onclick =
            function(){

                chapterBox
                    .classList
                    .toggle("open");

            };


        chapterBox.appendChild(title);

        chapterBox.appendChild(lessons);

        container.appendChild(chapterBox);

    });

}


/* =====================================================
   LEÇON
===================================================== */

function openLesson(chapterIndex,lessonIndex){

    const chapter =
        PROGRAM[chapterIndex];

    const lesson =
        chapter[2][lessonIndex];


    document
        .getElementById("lessonTitle")
        .textContent =
        lesson[0];


    document
        .getElementById("lessonTag")
        .textContent =
        chapter[0] +
        " " +
        chapter[1] +
        " — Leçon " +
        (lessonIndex+1);


    document
        .getElementById("lessonContent")
        .innerHTML =

        `
        <p style="color:var(--muted)">
            Formule clé
        </p>

        <div class="formula">
            $$${lesson[1]}$$
        </div>

        <h3 style="margin:20px 0 10px">
            Cours
        </h3>

        <p style="line-height:1.8">
            Le contenu détaillé de cette leçon
            peut être ajouté ici : explication,
            exemples, exercices et corrections.
        </p>
        `;


    if(window.renderMathInElement){

        renderMathInElement(
            document.getElementById("lessonContent"),
            {
                delimiters:[
                    {
                        left:"$$",
                        right:"$$",
                        display:true
                    }
                ],

                throwOnError:false
            }
        );

    }

}


renderCurriculum();

</script>

</body>
</html>
